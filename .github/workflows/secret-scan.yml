name: Secret Scanning

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Automated Secret Prevention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Sangam Secret Prevention Audit
        run: npm run audit:secrets

      - name: Run Self-Tests
        run: npm run audit:secrets:test

      - name: Run Gitleaks Security Scanner
        uses: gitleaks/gitleaks-action@v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERBOSE: 'false'
