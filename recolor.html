<!DOCTYPE html>
<html>
<head><title>Recolor</title></head>
<body>
  <canvas id="c"></canvas>
  <script>
    const img = new Image();
    img.src = '/src/assets/characters/director/director-character.png'; // Will be loaded by vite
    img.onload = () => {
      const canvas = document.getElementById('c');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      
      // We want to change the shirt from reddish-orange (#D67756 / ~rgb(214,119,86))
      // to yellow-gold (#DFB980 / ~rgb(223,185,128))
      
      // Let's use simple RGB distance to identify the shirt.
      // The shirt is generally red > 120, green < red - 30, blue < green.
      // Wait, let's sample the shirt colors precisely.
      // Actually, HSL is safer.
      for(let i=0; i<data.length; i+=4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        const a = data[i+3];
        if (a === 0) continue;
        
        let r_norm = r / 255;
        let g_norm = g / 255;
        let b_norm = b / 255;
        let max = Math.max(r_norm, g_norm, b_norm);
        let min = Math.min(r_norm, g_norm, b_norm);
        let h, s, l = (max + min) / 2;

        if (max === min) {
          h = s = 0; 
        } else {
          let d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r_norm: h = (g_norm - b_norm) / d + (g_norm < b_norm ? 6 : 0); break;
            case g_norm: h = (b_norm - r_norm) / d + 2; break;
            case b_norm: h = (r_norm - g_norm) / d + 4; break;
          }
          h /= 6; // hue is 0-1
        }
        
        // Shirt hue is typically around 0.02 - 0.05
        // Skin hue is typically around 0.05 - 0.1, but skin is lighter/less saturated.

      }
    };
  </script>
</body>
</html>
